  <body>
    <!-- Liquid glass refraction filter — referenced by .glass-* via backdrop-filter: url(#liquid-glass) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <!-- Lens-like displacement map: vertical gradient → squeezes content toward center -->
        <filter id="liquid-glass" x="0%" y="0%" width="100%" height="100%" primitiveUnits="objectBoundingBox">
          <feImage preserveAspectRatio="none" x="0" y="0" width="1" height="1"
            href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1' preserveAspectRatio='none'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='rgb(0,255,0)'/><stop offset='0.5' stop-color='rgb(0,128,0)'/><stop offset='1' stop-color='rgb(0,0,0)'/></linearGradient></defs><rect width='1' height='1' fill='url(%23g)'/></svg>"
            result="map"/>
          <feDisplacementMap in="SourceGraphic" in2="map" scale="22" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
