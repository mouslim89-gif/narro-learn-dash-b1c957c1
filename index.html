  <body>
    <!-- Liquid-glass edge-refraction filter. userSpaceOnUse + sRGB are required
         for backdrop-filter url() to work in Chromium. The displacement map and
         the filter geometry are kept in sync with the header's real pixel size
         at runtime (see src/lib/liquid-glass-map.ts). The inline href is a 1x1
         neutral-gray placeholder (no displacement) until the real map loads. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <filter id="liquid-glass" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB" x="0" y="0" width="430" height="64">
          <feImage id="liquid-glass-map" x="0" y="0" width="430" height="64" preserveAspectRatio="none" result="map"
                   href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVR4nGNoaGgAAAMEAYFL09IQAAAAAElFTkSuQmCC"/>
          <feDisplacementMap in="SourceGraphic" in2="map" scale="20" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
