  <body>
    <!-- Liquid glass refraction filter — referenced by .glass-* via backdrop-filter: url(#liquid-glass) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <filter id="liquid-glass" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.006 0.014" numOctaves="2" seed="4" result="noise"/>
          <feGaussianBlur in="noise" stdDeviation="2" result="softNoise"/>
          <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="32" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
